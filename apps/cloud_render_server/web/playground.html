<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>鸿图云渲染 — SDK 调试台</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0e13; overflow: hidden;
               font-family: -apple-system, "PingFang SC", sans-serif; color: #cfd8e3; }
  #wrap { display: flex; height: 100vh; }
  #left { flex: 1; min-width: 0; position: relative; background: #05070a; }
  #video { width: 100%; height: 100%; object-fit: contain; display: block; cursor: grab; }
  #video.dragging { cursor: grabbing; }
  #hud { position: absolute; top: 10px; left: 12px; font-size: 12px; color: #9ab;
         background: rgba(10,14,20,0.55); padding: 6px 10px; border-radius: 7px;
         backdrop-filter: blur(6px); user-select: none; pointer-events: none; }
  #hud b { color: #7fd0ff; }
  #status.ok { color: #6fe08f; } #status.err { color: #ff7a7a; }
  #panel { width: 460px; flex: none; display: flex; flex-direction: column;
           background: #11161d; border-left: 1px solid #232c38; }
  #panel h3 { margin: 0; padding: 11px 14px; font-size: 14px; color: #7fd0ff;
              border-bottom: 1px solid #232c38; }
  #panel h3 small { color: #6a7a8a; font-weight: normal; font-size: 11px; }
  .sect { padding: 8px 12px; }
  .sect-label { font-size: 11px; color: #7e92a6; margin: 2px 0 6px; }
  #snips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font-size: 12px; padding: 4px 9px; background: #1b2531; color: #cfd8e3;
          border: 1px solid #2d3a4a; border-radius: 14px; cursor: pointer; }
  .chip:hover { background: #243140; } .chip.on { background: #1d4a63; border-color: #2e7fa5; color: #d8f0ff; }
  #code { width: 100%; box-sizing: border-box; height: 280px; resize: vertical;
          background: #0c1015; color: #d6e2ee; border: 1px solid #2d3a4a; border-radius: 7px;
          padding: 9px 11px; font: 12.5px/1.5 "SF Mono", Menlo, Consolas, monospace;
          tab-size: 2; white-space: pre; overflow: auto; }
  #btns { display: flex; gap: 7px; padding: 0 12px 8px; }
  #btns button { flex: 1; padding: 8px; border-radius: 6px; cursor: pointer; font-size: 12.5px;
                 border: 1px solid #2d3a4a; background: #1c2530; color: #cfd8e3; }
  #btns button:hover { background: #26323f; }
  #run { background: #1d6f3f !important; border-color: #2c8a52 !important; color: #eafff0 !important; font-weight: 600; }
  #run:hover { background: #237a47 !important; }
  #btns .ghost { flex: none; }
  .log-head { display: flex; justify-content: space-between; align-items: center;
              padding: 6px 12px 2px; font-size: 11px; color: #7e92a6; }
  .log-head a { color: #6a7a8a; cursor: pointer; text-decoration: underline; }
  #log { flex: 1; overflow: auto; margin: 0 12px 12px; padding: 8px 10px;
         background: #0c1015; border: 1px solid #232c38; border-radius: 7px;
         font: 11.5px/1.45 "SF Mono", Menlo, Consolas, monospace; color: #93a4b5;
         white-space: pre-wrap; word-break: break-word; }
  .l-cam   { color: #7e8aa0; } .l-anno { color: #6fd0e6; } .l-model { color: #f0c060; }
  .l-fire  { color: #ff9a5a; } .l-layer { color: #b58ae0; } .l-env { color: #9ad06f; }
  .l-scene { color: #ff7a9a; } .l-err { color: #ff7a7a; }
</style>
</head>
<body>
<div id="wrap">
  <div id="left">
    <video id="video" autoplay playsinline muted></video>
    <div id="hud"><b>SDK 调试台</b> · <span id="status">连接中…</span><br>
      左键拖动 平移 · 右键拖动 旋转 · 滚轮 缩放 · 双击 复位</div>
  </div>
  <div id="panel">
    <h3>云渲染 SDK 调试台 <small>改下面代码里的参数 → 运行(⌘/Ctrl+↵)</small></h3>
    <div class="sect">
      <div class="sect-label">示例(点一下载入到编辑器)</div>
      <div id="snips"></div>
    </div>
    <div class="sect" style="flex:none">
      <textarea id="code" spellcheck="false"></textarea>
    </div>
    <div id="btns">
      <button id="run" title="⌘/Ctrl+Enter">▶ 运行</button>
      <button class="ghost" onclick="scene && scene.clear()">清空场景</button>
      <button class="ghost" onclick="scene && scene.camera.reset()">复位相机</button>
    </div>
    <div class="log-head"><span>已发送命令(代码 → datachannel JSON)</span>
      <a onclick="clearLog()">清空</a></div>
    <div id="log"></div>
  </div>
</div>

<script src="/htscene-protocol.js"></script>
<script src="/htscene.js"></script>
<script>
const video = document.getElementById('video');
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');
const codeEl = document.getElementById('code');
let scene = null;
window.scene = null;

const STATE = { connecting:['连接中…',''], negotiated:['协商完成,等待视频流…',''],
  live:['已连接 · 实时漫游中','ok'], lost:['连接断开 — 刷新重连','err'],
  closed:['连接已关闭','err'], 'signaling-failed':['信令失败','err'] };

// 出站命令 → 日志(把代码调用映射到真实 datachannel JSON,便于学习线协议)。
function logCmd(obj) {
  const ns = obj.ns || (obj.t ? 'cam' : 'scene');
  const cls = { polyline:'anno', polygon:'anno', marker:'anno', arrow:'anno',
    model:'model', fire:'fire', layer:'layer', environment:'env', scene:'scene', cam:'cam' }[ns] || 'anno';
  appendLog(JSON.stringify(obj), 'l-' + cls);
}
function appendLog(text, cls) {
  const div = document.createElement('div');
  div.className = cls || ''; div.textContent = text;
  logEl.appendChild(div);
  while (logEl.childNodes.length > 60) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight;
}
function clearLog() { logEl.innerHTML = ''; }

HtScene.connect({
  video,
  onStatus: s => { const m = STATE[s] || [s,'']; statusEl.textContent = m[0]; statusEl.className = m[1]; },
  onSend: logCmd,
}).then(s => { scene = s; window.scene = s; }).catch(e => { statusEl.textContent = '连接失败: ' + e; statusEl.className = 'err'; });

// ---- 鼠标 → 相机 ----
let drag = false, btn = 0, lx = 0, ly = 0;
video.addEventListener('contextmenu', e => e.preventDefault());
video.addEventListener('mousedown', e => { drag = true; btn = e.button; lx = e.clientX; ly = e.clientY; video.classList.add('dragging'); });
addEventListener('mouseup', () => { drag = false; video.classList.remove('dragging'); });
addEventListener('mousemove', e => { if (!drag || !scene) return;
  const dx = e.clientX - lx, dy = e.clientY - ly; lx = e.clientX; ly = e.clientY;
  btn === 2 ? scene.camera.orbit(dx, dy) : scene.camera.pan(dx, dy); });
video.addEventListener('wheel', e => { e.preventDefault(); if (scene) scene.camera.zoom(e.deltaY); }, { passive:false });
video.addEventListener('dblclick', () => scene && scene.camera.reset());

// ============================================================================
// 示例片段:每段代码里 `scene` 就是已连接的场景。改参数 → 运行。
// 默认 demo 场景是园区(本地米制,原点附近),坐标用米。
// ============================================================================
const SNIPPETS = [
  { name: '发光折线', code:
`// 线型 line_type: 0实线 2发光 4流动；glow_power 发光强度
scene.polyline.add({
  mode: 'local',
  vertices: [[-50, -20, 0.3], [0, 20, 0.3], [50, -20, 0.3]],
  style: { color: [0.3, 0.95, 1, 1], stroke_width_m: 2.0,
           line_type: 2, glow_power: 0.4 },
  layer_id: 9,
});` },
  { name: '流动飞线', code:
`// 流动贴图 + 箭头：flow_speed 流速、line_tex_tiling 密度、corner_smooth 拐角圆滑
scene.polyline.add({
  mode: 'local',
  vertices: [[-70, -30, 0.3], [-20, 20, 0.3], [30, -10, 0.3], [70, 25, 0.3]],
  style: { color: [0.3, 1, 0.6, 1], stroke_width_m: 2.5, line_type: 4,
           line_texture: 'arrow', line_tex_tiling: 0.2, flow_speed: 4, corner_smooth: 3 },
  layer_id: 9,
});` },
  { name: '扫描区域', code:
`// fill_type 1=扫描；fill_param 速度/密度
scene.polygon.add({
  mode: 'local',
  vertices: [[-30, -25, 0.3], [25, -25, 0.3], [30, 20, 0.3], [-20, 28, 0.3]],
  style: { color: [0.2, 0.9, 1, 0.5], stroke_width_m: 1.5,
           fill_type: 1, fill_param: 3, line_type: 2, glow_power: 0.4 },
  layer_id: 9,
});` },
  { name: '电子围栏', code:
`// wall=true 把多边形拉成发光墙；wall_height 墙高、wall_flow 流速
scene.polygon.add({
  mode: 'local',
  vertices: [[-25, -20, 0], [25, -20, 0], [25, 20, 0], [-25, 20, 0]],
  style: { color: [0.3, 0.85, 1, 0.7], stroke_width_m: 1.5,
           wall: true, wall_height: 14, wall_flow: 4, line_type: 2, glow_power: 0.4 },
  layer_id: 9,
});` },
  { name: '脉冲标注', code:
`// symbol_index 0..15 内置图标；symbol_effect: 0静 1脉冲 2跳动 3涟漪
scene.marker.add({
  mode: 'local',
  vertices: [[0, 0, 3]],
  style: { color: [1, 0.4, 0.3, 1], symbol_size_m: 6,
           symbol_index: 3, symbol_effect: 3, symbol_freq: 1.2 },
  layer_id: 9,
});` },
  { name: '弧线箭头', code:
`// line_type:5 弧线；arc_height_ratio 弧高占比；arrow_head 端点箭头
scene.arrow.add({
  mode: 'local',
  vertices: [[-40, 0, 0.3], [40, 20, 0.3]],
  style: { color: [1, 0.5, 0.7, 1], stroke_width_m: 1.5, line_type: 5,
           arc_height_ratio: 0.4, glow_power: 0.3, arrow_head: true },
  layer_id: 9,
});` },
  { name: '火苗(类型)', code:
`// type: pool_fire / jet_fire / smoke / gas_plume / sparks
//   scale=规模、wind=[x,y] 风
const id = scene.fire.add({ pos: [0, 0, 0.5], type: 'pool_fire', scale: 1.5, wind: [0.5, 0] });
console.log('fire id =', id);   // 留着可 scene.fire.update(id,{...}) / remove(id)` },
  { name: '运行时模型', code:
`// 运行时加载服务端 glb,move/缩放(仅 yaw + 均匀缩放)
const id = scene.model.add({ url: 'park/trees/jacaranda_tree.glb',
                             pos: [10, 5, 0], rot: 0, scale: 1.0 });
setTimeout(() => scene.model.update(id, { pos: [20, 5, 0], rot: 90 }), 1500);` },
  { name: '控制预放实体', code:
`// 仅当服务端 --open=<工程> 且工程里有该 id 的预放实体时生效。
// 用编辑器稳定 id 寻址(查看:工程 .editor.json 的 models[].id)。
scene.entity.moveModel(101, { pos: [20, 0, 0], rot: 45 });
// scene.entity.hideModel(101);   scene.entity.showModel(101);
// scene.entity.moveFire(201, { pos: [15, 0, 0.5] });` },
  { name: '图层显隐', code:
`scene.layer.hide(9);              // 隐藏 layer_id=9(上面示例都挂在 9)
setTimeout(() => scene.layer.show(9), 1500);` },
  { name: '环境 / 昼夜', code:
`scene.env({ time_of_day: 8.5, time_speed: 0 });    // 早晨 8:30 静止
// scene.env({ time_of_day: 20, time_speed: 0 });   // 黄昏
// scene.env({ time_of_day: 1, time_speed: 60 });   // 昼夜循环 60×
// scene.env({ time_of_day: -1, sun_azimuth: 120, sun_elevation: 35, sun_intensity: 5, skybox: 1 });` },
  { name: '相机', code:
`scene.camera.orbit(30, 0);       // 环绕(像素量)
scene.camera.zoom(-200);         // 推近
// scene.camera.pan(50, 0);  scene.camera.reset();` },
  { name: '清空', code: `scene.clear();   // 清掉所有动态对象(图层显隐保留)` },
];

const snipsEl = document.getElementById('snips');
SNIPPETS.forEach((s, i) => {
  const b = document.createElement('div');
  b.className = 'chip'; b.textContent = s.name;
  b.onclick = () => { document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
    b.classList.add('on'); codeEl.value = s.code; };
  snipsEl.appendChild(b);
});
codeEl.value = SNIPPETS[0].code;
document.querySelector('.chip').classList.add('on');

function run() {
  if (!scene) { appendLog('// 未连接,稍候…', 'l-err'); return; }
  try {
    new Function('scene', 'HtSceneProtocol', codeEl.value)(scene, window.HtSceneProtocol);
  } catch (e) { appendLog('// 错误: ' + e.message, 'l-err'); }
}
document.getElementById('run').onclick = run;
codeEl.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); run(); }
  if (e.key === 'Tab') { e.preventDefault();
    const s = codeEl.selectionStart; codeEl.setRangeText('  ', s, codeEl.selectionEnd, 'end'); }
});
</script>
</body>
</html>
