<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>鸿图云渲染 — 园区漫游</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0e13; overflow: hidden;
               font-family: -apple-system, "PingFang SC", sans-serif; }
  #video { width: 100vw; height: 100vh; object-fit: contain; display: block;
           cursor: grab; }
  #video.dragging { cursor: grabbing; }
  #hud { position: fixed; top: 12px; left: 14px; color: #cfd8e3; font-size: 13px;
         background: rgba(10, 14, 20, 0.55); padding: 8px 12px; border-radius: 8px;
         backdrop-filter: blur(6px); user-select: none; pointer-events: none; }
  #hud b { color: #7fd0ff; }
  #status { color: #9ab; }
  #status.ok { color: #6fe08f; }
  #status.err { color: #ff7a7a; }
  #panel { position: fixed; top: 12px; right: 14px; width: 188px;
           background: rgba(10,14,20,0.6); border-radius: 10px; padding: 10px;
           backdrop-filter: blur(6px); color: #cfd8e3; font-size: 12px; }
  #panel h4 { margin: 2px 0 8px; color: #7fd0ff; font-size: 13px; }
  #panel button { display: block; width: 100%; margin: 4px 0; padding: 6px;
           background: #1c2530; color: #cfd8e3; border: 1px solid #2d3a4a;
           border-radius: 6px; cursor: pointer; font-size: 12px; }
  #panel button:hover { background: #26323f; }
  #panel button.clear { background: #3a2326; border-color: #5a3a3a; }
  #panel .sep { margin: 9px 0 3px; padding-top: 8px; border-top: 1px solid #2a3a4a;
           color: #8aa3b8; font-size: 11px; }
  #panel .idrow { margin: 4px 0; color: #9ab; }
  #panel .idrow input { width: 64px; background: #11171f; color: #cfd8e3;
           border: 1px solid #2d3a4a; border-radius: 5px; padding: 3px 5px; font-size: 12px; }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<div id="hud">
  <b>鸿图云渲染</b> · <span id="status">连接中…</span><br>
  左键拖动 平移 · 右键拖动 旋转 · 滚轮 缩放 · 双击 复位
</div>
<div id="panel">
  <h4>动态标绘 SDK 演示</h4>
  <button onclick="demoPolyline()">+ 发光折线</button>
  <button onclick="demoFlow()">+ 流光路径</button>
  <button onclick="demoPolygon()">+ 扫描区域</button>
  <button onclick="demoWall()">+ 电子围栏</button>
  <button onclick="demoMarker()">+ 脉冲标注</button>
  <button onclick="demoArrow()">+ 飞行箭头</button>
  <button onclick="demoModel()">+ 模型(树)</button>
  <button onclick="demoFire()">+ 火苗</button>
  <button onclick="htscene.layer.hide(9)">隐藏图层 9</button>
  <button onclick="htscene.layer.show(9)">显示图层 9</button>
  <button onclick="htscene.env({time_of_day:8.5,time_speed:0})">☀ 早晨 8:30</button>
  <button onclick="htscene.env({time_of_day:20,time_speed:0})">🌆 黄昏 20:00</button>
  <button onclick="htscene.env({time_of_day:1,time_speed:60})">🌗 昼夜循环</button>
  <button onclick="htscene.env({time_of_day:-1,sun_azimuth:120,sun_elevation:35,sun_intensity:5,skybox:1})">手动太阳</button>
  <button class="clear" onclick="htscene.clear()">清空</button>
  <div class="sep">控制预加载实体(编辑器 id)</div>
  <div class="idrow">实体 id <input id="eid" type="number" value="101" min="1"></div>
  <button onclick="moveModel()">↗ 移动该模型</button>
  <button onclick="htscene.entity.showModel(eid())">显示该模型</button>
  <button onclick="htscene.entity.hideModel(eid())">隐藏该模型</button>
  <button onclick="moveFire()">↗ 移动该火苗</button>
  <button onclick="htscene.entity.removeFire(eid())">熄灭该火苗</button>
</div>
<script src="htscene-protocol.js"></script>
<script src="htscene.js"></script>
<script>
const video  = document.getElementById('video');
const status_ = document.getElementById('status');
function setStatus(text, cls) { status_.textContent = text; status_.className = cls || ''; }

// 连接状态码 → 中文提示 + 样式。
const STATE = {
  connecting:        ['连接中…', ''],
  negotiated:        ['协商完成,等待视频流…', ''],
  live:              ['已连接 · 实时漫游中', 'ok'],
  lost:              ['连接断开 — 刷新页面重连', 'err'],
  closed:            ['连接已关闭', 'err'],
  'signaling-failed':['信令失败 — 刷新重试', 'err'],
};

// htscene = SDK 返回的 scene 对象(连接成功后赋值)。SDK 来自 htscene.js。
let htscene = null;
HtScene.connect({
  video,
  onStatus: s => { const m = STATE[s] || [s, '']; setStatus(m[0], m[1]); },
}).then(scene => {
  htscene = scene;
  window.htscene = scene;  // 控制台 / 演示按钮调用
}).catch(e => setStatus('连接失败: ' + e, 'err'));

// ---- 鼠标 → 相机(经 SDK camera.*;连接前忽略)-------------------------------
let dragging = false, button = 0, lastX = 0, lastY = 0;
video.addEventListener('contextmenu', e => e.preventDefault());
video.addEventListener('mousedown', e => {
  dragging = true; button = e.button; lastX = e.clientX; lastY = e.clientY;
  video.classList.add('dragging');
});
window.addEventListener('mouseup', () => { dragging = false; video.classList.remove('dragging'); });
window.addEventListener('mousemove', e => {
  if (!dragging || !htscene) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  if (button === 2) htscene.camera.orbit(dx, dy); else htscene.camera.pan(dx, dy);
});
video.addEventListener('wheel', e => {
  e.preventDefault();
  if (htscene) htscene.camera.zoom(e.deltaY);
}, { passive: false });
video.addEventListener('dblclick', () => { if (htscene) htscene.camera.reset(); });

// ---- 演示:在园区中心附近随机位置撒各类要素(均挂 layer_id 9 便于显隐)----
const Z = 0.3, L = 9;
const rnd = (a, b) => a + Math.random() * (b - a);
function ring(cx, cy, r, n) {
  const p = []; for (let i = 0; i < n; i++) { const a = i / n * 6.283;
    p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r, Z]); } return p;
}
function demoPolyline() {
  htscene.polyline.add({ mode:'local', vertices:[
    [rnd(-60,-20),rnd(-30,30),Z],[rnd(-15,15),rnd(-30,30),Z],[rnd(20,60),rnd(-30,30),Z]],
    style:{ color:[0.3,0.95,1,1], stroke_width_m:2.0, line_type:2, glow_power:0.35 }, layer_id:L });
}
function demoFlow() {
  htscene.polyline.add({ mode:'local', vertices:[
    [-70,rnd(-40,40),Z],[ -20,rnd(-40,40),Z],[ 30,rnd(-40,40),Z],[ 70,rnd(-40,40),Z]],
    style:{ color:[0.3,1,0.6,1], stroke_width_m:2.5, line_type:4, line_texture:'arrow',
            line_tex_tiling:0.2, flow_speed:4, corner_smooth:3 }, layer_id:L });
}
function demoPolygon() {
  const c=[rnd(-40,40),rnd(-40,40)];
  htscene.polygon.add({ mode:'local', vertices: ring(c[0],c[1],rnd(12,22),6),
    style:{ color:[0.2,0.9,1,0.5], stroke_width_m:1.5, fill_type:1, fill_param:3,
            line_type:2, glow_power:0.4 }, layer_id:L });
}
function demoWall() {
  const c=[rnd(-40,40),rnd(-40,40)];
  htscene.polygon.add({ mode:'local', vertices: ring(c[0],c[1],rnd(14,22),6),
    style:{ color:[0.3,0.85,1,0.7], stroke_width_m:1.5, wall:true, wall_height:14,
            wall_flow:4, line_type:2, glow_power:0.4 }, layer_id:L });
}
function demoMarker() {
  htscene.marker.add({ mode:'local', vertices:[[rnd(-50,50),rnd(-50,50),3]],
    style:{ color:[1,0.4,0.3,1], symbol_size_m:6, symbol_index:3, symbol_effect:3,
            symbol_freq:1.2 }, layer_id:L });
}
function demoArrow() {
  htscene.arrow.add({ mode:'local', vertices:[[0,0,Z],[rnd(20,55),rnd(-45,45),Z]],
    style:{ color:[1,0.5,0.7,1], stroke_width_m:1.5, line_type:5, arc_height_ratio:0.4,
            glow_power:0.3, arrow_head:true }, layer_id:L });
}
function demoModel() {
  htscene.model.add({ url:'park/trees/jacaranda_tree.glb',
    pos:[rnd(-50,50),rnd(-50,50),0], rot:rnd(0,360), scale:rnd(0.7,1.3) });
}
function demoFire() {
  htscene.fire.add({ pos:[rnd(-40,40),rnd(-40,40),0.5], rate:90 });
}

// ---- 控制预加载工程实体:用编辑器存档里的稳定 id 寻址(model/fire 已写盘)----
function eid() { return parseInt(document.getElementById('eid').value, 10) || 0; }
function moveModel() {
  htscene.entity.moveModel(eid(), { pos:[rnd(-40,40),rnd(-40,40),0], rot:rnd(0,360) });
}
function moveFire() {
  htscene.entity.moveFire(eid(), { pos:[rnd(-40,40),rnd(-40,40),0.5] });
}
// 连接在顶部 HtScene.connect(...) 已发起,无需再调。
</script>
</body>
</html>
